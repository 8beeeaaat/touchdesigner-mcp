type: object
description: Aggregated node error report
required:
  - nodePath
  - nodeName
  - opType
  - errorCount
  - warningCount
  - hasErrors
  - hasWarnings
  - errors
properties:
  nodePath:
    type: string
    description: Path that was inspected for errors
  nodeName:
    type: string
    description: Name of the inspected node
  opType:
    type: string
    description: Operator type of the inspected node
  errorCount:
    type: integer
    description: Number of entries with level "error"
  warningCount:
    type: integer
    description: Number of entries with level "warning"
  hasErrors:
    type: boolean
    description: Convenience flag indicating if any errors were found
  hasWarnings:
    type: boolean
    description: Convenience flag indicating if any warnings were found
  errors:
    type: array
    description: >-
      Collection of node messages, both errors and warnings. Use each entry's
      level to tell them apart.
    items:
      $ref: ./TdNodeError.yml
