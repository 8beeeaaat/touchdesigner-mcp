type: object
description: Aggregated node error report
required:
  - nodePath
  - nodeName
  - opType
  - errorCount
  - hasErrors
  - errors
properties:
  nodePath:
    type: string
    description: Path that was inspected for errors
  nodeName:
    type: string
    description: Name of the inspected node
  opType:
    type: string
    description: Operator type of the inspected node
  errorCount:
    type: integer
    description: Number of entries with level "error"
  warningCount:
    type: integer
    default: 0
    description: >-
      Number of entries with level "warning". Absent from a TouchDesigner
      component older than this field; treat absence as unknown rather than
      zero where the distinction matters.
  hasErrors:
    type: boolean
    description: Convenience flag indicating if any errors were found
  hasWarnings:
    type: boolean
    default: false
    description: >-
      Convenience flag indicating if any warnings were found. Absent from an
      older component, so do not read its absence as "no warnings".
  incomplete:
    type: boolean
    default: false
    description: >-
      True when a stream could not be read, or when a line that looked like a
      new message named an operator that could not be resolved. Either way the
      counts below are a floor rather than a total, so do not read hasErrors
      false as "clean" while this is set.
  skippedStreams:
    type: array
    description: Streams that could not be read, with the reason for each
    items:
      type: object
      required:
        - stream
        - reason
      properties:
        stream:
          type: string
          description: Which stream was skipped ("errors" or "warnings")
        reason:
          type: string
          description: Why it could not be read
  unresolvedAnchors:
    type: array
    description: >-
      Operator paths that began a message but could not be resolved. Their
      lines were kept with the preceding entry, so a failure they describe may
      be folded into another operator's message rather than counted on its own.
      A deleted operator and a file path quoted inside a traceback are
      indistinguishable here, which is why the ambiguity is reported.
    items:
      type: string
  errors:
    type: array
    description: >-
      Collection of node messages, both errors and warnings. Use each entry's
      level to tell them apart.
    items:
      $ref: ./TdNodeError.yml
