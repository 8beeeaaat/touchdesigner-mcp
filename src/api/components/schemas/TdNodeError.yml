type: object
description: Single node error entry
required:
  - nodePath
  - nodeName
  - opType
  - message
properties:
  nodePath:
    type: string
    description: Absolute operator path that reported the error
  nodeName:
    type: string
    description: Name of the operator
  opType:
    type: string
    description: TouchDesigner operator type
  level:
    type: string
    enum:
      - error
      - warning
    default: error
    description: >-
      Severity reported by TouchDesigner. Many common failures (missing files,
      dangling operator references, shader compile failures) are surfaced as
      warnings rather than errors.
  message:
    type: string
    description: >-
      Message reported by TouchDesigner. May span multiple lines when the
      failure carries a Python traceback.
