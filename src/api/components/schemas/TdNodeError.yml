type: object
description: Single node error entry
required:
  - nodePath
  - nodeName
  - opType
  - message
properties:
  nodePath:
    type: string
    description: Absolute operator path that reported the error
  nodeName:
    type: string
    description: Name of the operator
  opType:
    type: string
    description: TouchDesigner operator type
  level:
    type: string
    enum:
      - error
      - warning
    description: >-
      Severity reported by TouchDesigner. Many common failures (missing files,
      dangling operator references, shader compile failures) are surfaced as
      warnings rather than errors. Which collection an entry arrives in is
      the authority; this repeats it for clients that flatten the two. Stated
      in prose rather than as a schema default, because a default would tell
      a generator to read an absent level as "error", which is the opposite
      of what it means inside warnings.
  message:
    type: string
    description: >-
      Message reported by TouchDesigner. May span multiple lines when the
      failure carries a Python traceback.
